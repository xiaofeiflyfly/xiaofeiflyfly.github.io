{% extends "layout.html" %}
{% block title %}{{ post.title }} | {{ config.title }}{% endblock %}
{% block htmlhead %}
  <meta property="og:title" content="{{ post.title }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ post.absolute_url }}">
  <meta property="og:site_name" content="{{ config.title }}">
  <meta property="og:description" content="{{ post.summary }}">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="{{ post.absolute_url }}">
{% endblock %}
{% block content %}
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ post.html_title }}</h1>
    <p class="meta">
      <time datetime="{{ post.date_iso }}">{{ post.date_cn }}</time>
      {%- for tag, url in post.tag_urls %} · <a class="tag" href="{{ url }}">{{ tag }}</a>{% endfor %}
    </p>
  </header>
  <div class="post-content">
    {{ post.html }}
  </div>
</article>
{% endblock %}
