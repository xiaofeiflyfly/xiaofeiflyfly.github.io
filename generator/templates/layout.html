<!doctype html>
<html lang="{{ config.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ config.base_path }}/feed.atom">
  <link rel="stylesheet" href="{{ config.base_path }}/static/style.css">
  <link rel="stylesheet" href="{{ config.base_path }}/static/pygments.css">
  {% block htmlhead %}{% endblock %}
</head>
<body>
<div class="container">
  <header class="site-header">
    <h1 class="site-title"><a href="{{ config.base_path }}/">{{ config.title }}</a></h1>
    <p class="site-subtitle">{{ config.subtitle }}</p>
    <nav class="site-nav">
      <a href="{{ config.base_path }}/">首页</a>
      <a href="{{ config.base_path }}/archive/">归档</a>
      <a href="{{ config.base_path }}/feed.atom">订阅</a>
    </nav>
  </header>
  <main class="body">
  {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>© 2026 {{ config.author }} · 由 <a href="https://github.com/xiaofeiflyfly/blog">自研生成器</a> 驱动 · 系统字体排版</p>
  </footer>
</div>
</body>
</html>
